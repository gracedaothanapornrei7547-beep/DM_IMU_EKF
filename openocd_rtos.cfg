# OpenOCD 配置:CMSIS-DAP + STM32H7 + FreeRTOS 线程感知
# 本调试器需要 xPack OpenOCD 0.12.0；Ubuntu 自带的 0.11.0 会错误报告不支持 SWD。
source [find interface/cmsis-dap.cfg]
cmsis-dap vid_pid 0xef1a 0x74e5
transport select swd
adapter speed 1000
source [find target/stm32h7x.cfg]
reset_config none

# 让 OpenOCD 感知 FreeRTOS，GDB/CLion 才能列出任务线程。
stm32h7x.cpu0 configure -rtos auto
